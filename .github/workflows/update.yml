name: Update articles

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    paths: ["feeds.json", "fetch_feeds.py"]

permissions:
  contents: write

concurrency:
  group: update-articles
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch feeds
        run: python fetch_feeds.py

      - name: Commit updated articles
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add docs/articles.json
          git diff --cached --quiet || git commit -m "Update articles $(date -u '+%Y-%m-%d %H:%M')"
          git pull --rebase --autostash
          git push
